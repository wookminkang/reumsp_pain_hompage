name: 칼럼 예약 발행

# content/columns/schedule.md에 적힌 게재일이 되면 해당 원고를 index.ts에 등록하고
# 커밋·푸시한다. 푸시가 Vercel 자동 배포를 트리거해 그날 원고가 사이트에 공개된다.
#
# 원고 파일은 미리 만들어 두되 index.ts에 import하지 않으면 빌드 산출물에 들어가지
# 않아 사이트에 노출되지 않는다. 이 워크플로가 그 등록만 날짜에 맞춰 대신한다.

on:
  schedule:
    # UTC 00:00 = KST 09:00. GitHub의 스케줄은 UTC 기준이다.
    # 부하가 몰리는 정각에는 실행이 몇 분에서 수십 분 지연될 수 있으나,
    # 하루 단위 발행이라 문제되지 않는다.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "기준일 (YYYY-MM-DD). 비우면 오늘(KST). 밀린 날짜를 한꺼번에 올릴 때 사용"
        required: false
        type: string
      dry_run:
        description: "등록 대상만 확인하고 커밋하지 않음"
        required: false
        type: boolean
        default: false

# 같은 워크플로가 겹쳐 돌면 index.ts에 중복 등록될 수 있으므로 직렬화한다.
concurrency:
  group: publish-columns
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 게재일이 지난 원고 등록
        id: register
        run: |
          ARGS=""
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="--date ${{ inputs.date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/publish-due-columns.mjs $ARGS

      - name: 변경 여부 확인
        id: changed
        run: |
          if git diff --quiet -- content/columns/index.ts; then
            echo "result=none" >> "$GITHUB_OUTPUT"
            echo "등록할 칼럼이 없습니다. 커밋하지 않고 종료합니다."
          else
            echo "result=yes" >> "$GITHUB_OUTPUT"
            git diff --stat -- content/columns/index.ts
          fi

      # 잘못된 등록이 그대로 배포되지 않도록 커밋 전에 타입 검증한다.
      # summary 4문장·faq 3개 이상이 컴파일 타임에 강제되므로 여기서 걸린다.
      - name: 타입 검증
        if: steps.changed.outputs.result == 'yes'
        run: npx tsc --noEmit

      - name: 커밋 및 푸시
        if: steps.changed.outputs.result == 'yes'
        run: |
          # 작성자를 기존 커밋과 동일하게 맞춘다. Vercel이 커밋 작성자의 협업 권한을
          # 확인해 배포를 막은 이력이 있어(2026-08-25) 봇 계정으로 커밋하지 않는다.
          git config user.name "kangminwook"
          git config user.email "kangmu950@gmail.com"

          SLUGS=$(git diff -- content/columns/index.ts \
            | grep '^+import' \
            | sed -E 's|.*from "\./(.*)";|\1|' \
            | paste -sd "," - \
            | sed 's/,/, /g')

          git add content/columns/index.ts
          git commit -m "chore: 칼럼 예약 발행 (${SLUGS})"

          # 푸시가 경합으로 실패해도 다음 날 실행이 밀린 날짜를 한꺼번에 등록하므로
          # 여기서 재시도하지 않고 실패시켜 알림이 가게 둔다.
          git push
